    - data:
        code: "import json\nimport re\n\ndef main(budget_records=None, plan=None,\
          \ query=None, detail_headers=None, detail_keys=None, source_status=None,\
          \ source_message=None):\n    try: rows = json.loads(budget_records) if isinstance(budget_records,\
          \ str) else (budget_records or [])\n    except Exception: rows = []\n  \
          \  try: plan = json.loads(plan) if isinstance(plan, str) else (plan or {})\n\
          \    except Exception: plan = {}\n\n    def text(v): return \"\" if v is\
          \ None else str(v).strip()\n    def num(v):\n        try: return float(v\
          \ or 0)\n        except Exception: return 0.0\n    def median(group, field,\

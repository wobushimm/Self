    - data:
        code: "import json\nimport re\n\n\ndef main(query=None, employees=None, headers=None):\n\
          \    \"\"\"\n    根据用户问题和 Excel 真实数据确定候选查询条件。\n\n    支持：\n    - 直接说部门名称，例如“查询市场部人员”\n\
          \    - 明确字段，例如“二级部门为研发一部”\n    - 层级表达，例如“研发中心下研发一部”\n    - 日期、数值、AND / OR\
          \ 等条件交给后续查询计划节点解析\n    \"\"\"\n\n    query = str(query or \"\").strip()\n\
          \    employees = employees or []\n    headers = headers or []\n\n    def\
          \ format_candidates(candidates):\n        if not candidates:\n         \
          \   return \"没有找到可由Excel真实数据直接确认的条件。\"\n\n        lines = [\n          \
          \  \"以下条件由Excel真实数据直接匹配得到，\",\n            \"属于确定性事实，不允许LLM修改：\"\n     \
          \   ]\n\n        for index, item in enumerate(candidates, start=1):\n  \
          \          lines.append(\n                f\"{index}. 字段：{item.get('field',\
          \ '')}；\"\n                f\"值：{item.get('value', '')}；\"\n           \
          \     f\"匹配方式：{item.get('match_type', '')}\"\n            )\n\n        return\
          \ \"\\n\".join(lines)\n\n    def result(status, message, candidates=None):\n\
          \        candidates = candidates or []\n\n        return {\n           \
          \ \"status\": status,\n            \"message\": message,\n            \"\
          candidate_count\": len(candidates),\n            \"candidate_json\": json.dumps(\n\
          \                candidates,\n                ensure_ascii=False\n     \
          \       ),\n            \"candidate_text\": format_candidates(candidates)\n\
          \        }\n\n    if not query:\n        return result(\"error\", \"用户问题为空。\"\
          )\n\n    if not isinstance(employees, list):\n        return result(\"error\"\
          , \"人员数据格式错误。\")\n\n    if not employees:\n        return result(\"error\"\
          , \"没有可用于识别查询条件的人员数据。\")\n\n    if not isinstance(headers, list):\n    \
          \    return result(\"error\", \"Excel表头格式错误。\")\n\n    # 不允许通过人员检索返回的敏感字段\n\
          \    sensitive_keywords = [\n        \"身份证\",\n        \"证件号\",\n      \
          \  \"手机号\",\n        \"手机号码\",\n        \"联系电话\",\n        \"电话号码\",\n \
          \       \"家庭地址\",\n        \"家庭住址\",\n        \"住址\",\n        \"银行卡\",\n\
          \        \"银行账号\",\n        \"工资\",\n        \"薪资\",\n        \"薪酬\",\n\
          \        \"奖金\"\n    ]\n\n    def is_sensitive(field):\n        field =\
          \ str(field or \"\")\n        return any(keyword in field for keyword in\
          \ sensitive_keywords)\n\n    # 这些字段不适合直接按“值”识别，避免误匹配\n    excluded_value_fields\
          \ = {\n        \"序号\",\n        \"年龄\",\n        \"司龄\",\n        \"司龄(年)\"\
          ,\n        \"入职日期\"\n    }\n\n    # 清理真实表头\n    real_fields = []\n\n   \
          \ for header in headers:\n        field = str(header or \"\").strip()\n\n\
          \        if not field:\n            continue\n\n        if field not in\
          \ real_fields:\n            real_fields.append(field)\n\n    # 字段 -> 值集合；值\
          \ -> 字段集合\n    field_value_index = {}\n    value_field_index = {}\n\n  \
          \  for field in real_fields:\n        if is_sensitive(field):\n        \
          \    continue\n\n        if field in excluded_value_fields:\n          \
          \  continue\n\n        values = set()\n\n        for employee in employees:\n\
          \            if not isinstance(employee, dict):\n                continue\n\
          \n            value = str(employee.get(field, \"\")).strip()\n\n       \
          \     if not value:\n                continue\n\n            # 纯数字不参与普通文本匹配。\n\
          \            # 防止“2023-01-01”中的数字被误识别为其他字段值。\n            if re.fullmatch(r\"\
          \\d+(?:\\.\\d+)?\", value):\n                continue\n\n            # 单字值不参与普通匹配，性别后续单独处理\n\
          \            if len(value) < 2:\n                continue\n\n          \
          \  values.add(value)\n\n        field_value_index[field] = values\n\n  \
          \      for value in values:\n            value_field_index.setdefault(value,\
          \ []).append(field)\n\n    candidates = []\n    forced_values = set()\n\n\
          \    def add_candidate(field, value, match_type, confidence=1.0):\n    \
          \    candidates.append({\n            \"field\": field,\n            \"\
          operator\": \"equals\",\n            \"value\": value,\n            \"match_type\"\
          : match_type,\n            \"confidence\": confidence\n        })\n\n  \
          \  # ==================================================\n    # 1. 用户明确写出字段名时，字段名优先\n\
          \    # 例如：二级部门为研发一部\n    # ==================================================\n\
          \    for field, values in field_value_index.items():\n        field_pattern\
          \ = re.compile(\n            re.escape(field)\n            + r\"\\s*(?:为|是|等于|：|:)\\\
          s*\"\n        )\n\n        for field_match in field_pattern.finditer(query):\n\
          \            value_start = field_match.end()\n\n            for value in\
          \ sorted(values, key=len, reverse=True):\n                if query.startswith(value,\
          \ value_start):\n                    add_candidate(\n                  \
          \      field,\n                        value,\n                        \"\
          explicit_field_match\"\n                    )\n\n                    forced_values.add(value)\n\
          \                    break\n\n    # ==================================================\n\
          \    # 2. 一级部门下二级部门的层级识别\n    # 例如：研发中心下研发一部\n    # ==================================================\n\
          \    first_dept_field = \"一级部门\"\n    second_dept_field = \"二级部门\"\n\n \
          \   if (\n        first_dept_field in field_value_index\n        and second_dept_field\
          \ in field_value_index\n    ):\n        hierarchy_pairs = set()\n\n    \
          \    for employee in employees:\n            if not isinstance(employee,\
          \ dict):\n                continue\n\n            first_dept = str(\n  \
          \              employee.get(first_dept_field, \"\")\n            ).strip()\n\
          \n            second_dept = str(\n                employee.get(second_dept_field,\
          \ \"\")\n            ).strip()\n\n            if first_dept and second_dept:\n\
          \                hierarchy_pairs.add(\n                    (first_dept,\
          \ second_dept)\n                )\n\n        for first_dept, second_dept\
          \ in hierarchy_pairs:\n            hierarchy_pattern = re.compile(\n   \
          \             re.escape(first_dept)\n                + r\"\\s*(?:下|下面|下属)\\\
          s*\"\n                + re.escape(second_dept)\n            )\n\n      \
          \      if hierarchy_pattern.search(query):\n                add_candidate(\n\
          \                    first_dept_field,\n                    first_dept,\n\
          \                    \"hierarchy_match\"\n                )\n\n        \
          \        add_candidate(\n                    second_dept_field,\n      \
          \              second_dept,\n                    \"hierarchy_match\"\n \
          \               )\n\n                forced_values.add(first_dept)\n   \
          \             forced_values.add(second_dept)\n\n    # ==================================================\n\
          \    # 3. 普通真实值匹配\n    # ==================================================\n\
          \    matched_spans = []\n\n    for value in sorted(\n        value_field_index.keys(),\n\
          \        key=len,\n        reverse=True\n    ):\n        if value in forced_values:\n\
          \            continue\n\n        start = query.find(value)\n\n        if\
          \ start < 0:\n            continue\n\n        end = start + len(value)\n\
          \n        covered = any(\n            start >= old_start and end <= old_end\n\
          \            for old_start, old_end in matched_spans\n        )\n\n    \
          \    if covered:\n            continue\n\n        fields = value_field_index[value]\n\
          \n        if len(fields) == 1:\n            add_candidate(\n           \
          \     fields[0],\n                value,\n                \"exact_value_match\"\
          \n            )\n\n            matched_spans.append((start, end))\n\n  \
          \      else:\n            # 同名部门同时出现在一级、二级部门时，\n            # 默认按一级部门查询，使“查询市场部人员”可直接使用。\n\
          \            department_fields = {\"一级部门\", \"二级部门\"}\n\n            if\
          \ set(fields).issubset(department_fields):\n                preferred_field\
          \ = (\n                    \"一级部门\"\n                    if \"一级部门\" in\
          \ fields\n                    else \"二级部门\"\n                )\n\n     \
          \           add_candidate(\n                    preferred_field,\n     \
          \               value,\n                    \"department_default_match\"\
          \n                )\n\n                matched_spans.append((start, end))\n\
          \n            else:\n                candidates.append({\n             \
          \       \"field\": \"\",\n                    \"operator\": \"equals\",\n\
          \                    \"value\": value,\n                    \"possible_fields\"\
          : fields,\n                    \"match_type\": \"ambiguous_value_match\"\
          ,\n                    \"confidence\": 0.0\n                })\n\n    #\
          \ ==================================================\n    # 4. 性别单字匹配\n\
          \    # ==================================================\n    gender_fields\
          \ = [\n        field\n        for field in real_fields\n        if field\
          \ in [\"性别\", \"员工性别\"]\n    ]\n\n    if len(gender_fields) == 1:\n    \
          \    gender_field = gender_fields[0]\n\n        gender_patterns = {\n  \
          \          \"男\": [\n                r\"男性\",\n                r\"男员工\"\
          ,\n                r\"男职工\",\n                r\"男生\"\n            ],\n\
          \            \"女\": [\n                r\"女性\",\n                r\"女员工\"\
          ,\n                r\"女职工\",\n                r\"女生\"\n            ]\n \
          \       }\n\n        for gender_value, patterns in gender_patterns.items():\n\
          \            if any(\n                re.search(pattern, query)\n      \
          \          for pattern in patterns\n            ):\n                add_candidate(\n\
          \                    gender_field,\n                    gender_value,\n\
          \                    \"gender_pattern_match\"\n                )\n\n   \
          \ # ==================================================\n    # 5. 去重\n  \
          \  # ==================================================\n    unique_candidates\
          \ = []\n    seen = set()\n\n    for item in candidates:\n        key = (\n\
          \            item.get(\"field\", \"\"),\n            item.get(\"operator\"\
          , \"\"),\n            item.get(\"value\", \"\")\n        )\n\n        if\
          \ key not in seen:\n            seen.add(key)\n            unique_candidates.append(item)\n\
          \n    candidates = unique_candidates\n\n    # ==================================================\n\
          \    # 6. 只有未解决的字段歧义才报错\n    # ==================================================\n\
          \    ambiguous = [\n        item\n        for item in candidates\n     \
          \   if item.get(\"match_type\")\n        == \"ambiguous_value_match\"\n\
          \    ]\n\n    if ambiguous:\n        descriptions = []\n\n        for item\
          \ in ambiguous:\n            descriptions.append(\n                f'“{item[\"\
          value\"]}”可能属于字段：'\n                + \"、\".join(\n                    item.get(\"\
          possible_fields\", [])\n                )\n            )\n\n        return\
          \ result(\n            \"ambiguous\",\n            \"；\".join(descriptions),\n\
          \            candidates\n        )\n\n    if not candidates:\n        return\
          \ result(\n            \"no_match\",\n            \"未在用户问题中匹配到Excel真实字段值。\"\
          ,\n            []\n        )\n\n    return result(\n        \"success\"\
          ,\n        f\"已确定识别{len(candidates)}个查询条件。\",\n        candidates\n    )"

    - data:
        code: "import json\n\ndef main(budget_records=None):\n    try: rows = json.loads(budget_records)\
          \ if isinstance(budget_records, str) else (budget_records or [])\n    except\
          \ Exception: rows = []\n\n    def text(v): return str(v or \"\").strip()\n\
          \    def num(v):\n        try: return float(v or 0)\n        except Exception:\
          \ return 0.0\n    def median(values, include_zero=False):\n        values\
          \ = sorted(num(v) for v in values if include_zero or num(v) > 0)\n     \
          \   return values[len(values)//2] if values else 0\n    def mode(group,\
          \ field):\n        counts = {}\n        for row in group:\n            value\
          \ = text(row.get(field))\n            if value: counts[value] = counts.get(value,\
          \ 0) + 1\n        return sorted(counts, key=lambda value: (-counts[value],\
          \ value))[0] if counts else \"\"\n\n    employees = [row for row in rows\
          \ if isinstance(row, dict) and not text(row.get(\"姓名\")).startswith(\"待招\"\
          ) and not text(row.get(\"姓名\")).startswith(\"待优化\")]\n    groups = {}\n\
          \    for row in employees:\n        d1 = text(row.get(\"一级部门\")) or \"未分类\"\
          \n        d2 = text(row.get(\"二级部门\")) or d1\n        groups.setdefault((d1,\
          \ d2), []).append(row)\n\n    summaries = []\n    for (d1, d2), group in\
          \ groups.items():\n        summaries.append({\n            \"一级部门\": d1,\
          \ \"二级部门\": d2, \"样本人数\": len(group),\n            \"常见岗位\": sorted({text(row.get(\"\
          岗位\")) for row in group if text(row.get(\"岗位\"))}),\n            \"典型学历\"\
          : mode(group, \"学历\"), \"典型人员类型\": mode(group, \"人员类型\"),\n            \"\
          典型公司主体\": mode(group, \"公司主体\"), \"典型费用类别\": mode(group, \"费用类别\"),\n  \
          \          \"基本工资中位数\": median([row.get(\"基本工资(元)\") for row in group]),\n\
          \            \"交通补贴典型值\": median([row.get(\"交通补贴\") for row in group], True),\n\
          \            \"专业证书补贴典型值\": median([row.get(\"专业证书补贴\") for row in group],\
          \ True),\n            \"月餐补典型值\": median([row.get(\"餐补（输入）\") for row in\
          \ group], True),\n            \"月租房补贴典型值\": median([row.get(\"租房补贴\") for\
          \ row in group], True),\n            \"绩效折扣比例典型值\": median([row.get(\"绩效折扣比例\"\
          ) for row in group], True),\n            \"社保上涨比例典型值\": median([row.get(\"\
          社保公积金年度上涨比例\") for row in group]) or 1,\n            \"工会经费比例典型值\": median([row.get(\"\
          工会经费计提比例\") for row in group], True),\n        })\n\n    return {\"reference_summary\"\
          : json.dumps({\n        \"部门成本参考\": summaries,\n        \"计算边界\": [\n  \
          \          \"目前只计算人工成本合计，不生成业务线投入和分摊。\",\n            \"基本工资采用可比人员中位数；政策性补贴采用典型值。\"\
          ,\n            \"单位社保公积金按基本工资乘48%重新计算。\",\n            \"专利奖金和补偿金属于偶发项目，新招聘基准方案默认0。\"\
          ,\n            \"在岗月数由建议入职月份推导，取1至12个月。\"\n        ]\n    }, ensure_ascii=False)}\n"
        code_language: python3

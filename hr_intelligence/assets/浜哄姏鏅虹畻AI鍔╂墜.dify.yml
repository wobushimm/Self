    - data:
        code: "import json\n\n\ndef main(status=None, message=None, count=0, record=None,\
          \ query=None):\n    try:\n       if isinstance(record, str):\n        record\
          \ = json.loads(record) if record.strip() else []\n       else:\n       \
          \ record = record or []\n    except Exception:\n        record = []\n\n\
          \    status = str(status or \"\")\n    message = str(message or \"\")\n\n\
          \    try:\n        count = int(count or 0)\n    except Exception:\n    \
          \    count = 0\n\n    if status == \"success\":\n        lines = [f\"查询成功，符合条件的人数：{count}\
          \ 人。\"]\n        if not record:\n            return {\"text\": \"\\n\".join(lines)}\n\
          \n        # One person: display the returned safe fields as a concise profile.\n\
          \        if count == 1 and len(record) == 1:\n            lines.append(\"\
          \\n人员信息：\")\n            for field, value in record[0].items():\n      \
          \          display = str(value).strip() if value not in (None, \"\") else\
          \ \"暂无数据\"\n                lines.append(f\"- {field}：{display}\")\n   \
          \         return {\"text\": \"\\n\".join(lines)}\n\n        # Multiple people:\
          \ list every matched person once, without repeated status/count columns.\n\
          \        lines.append(\"\\n人员名单：\")\n        for index, item in enumerate(record,\
          \ start=1):\n            name = str(item.get(\"姓名\") or item.get(\"员工姓名\"\
          ) or item.get(\"人员姓名\") or \"未提供姓名\").strip()\n            details = []\n\
          \            for field in [\"一级部门\", \"二级部门\", \"部门\", \"所属部门\", \"岗位\"\
          , \"职位\", \"人员类型\", \"公司主体\"]:\n                value = item.get(field)\n\
          \                if value not in (None, \"\"):\n                    details.append(str(value).strip())\n\
          \            suffix = f\"（{'｜'.join(details)}）\" if details else \"\"\n\
          \            lines.append(f\"{index}. {name}{suffix}\")\n        return\
          \ {\"text\": \"\\n\".join(lines)}\n\n    if status == \"unsupported\":\n\
          \      return {\n        \"text\": f\"无法查询。\\n原因：{message}\"\n     }\n\n\
          \    if status == \"not_found\":\n        return {\"text\": f\"未查询到符合条件的人员。\\\
          n原因：{message}\"}\n\n    return {\"text\": f\"查询失败。\\n原因：{message}\"}\n"
        code_language: python3
        desc: 以自然语言汇总查询状态、总人数和完整名单，不重复展示状态列。
        outputs:
          text:
            children: null
            type: string

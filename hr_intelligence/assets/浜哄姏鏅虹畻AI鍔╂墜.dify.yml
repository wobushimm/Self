    - data:
        code: "import json\nimport re\nimport unicodedata\nfrom datetime import datetime\n\
          \n\ndef main(\n    employees=None,\n    headers=None,\n    structured_output=None,\n\
          \    candidate_json=None,\n    query=None\n):\n    \"\"\"\n    动态人员信息查询。\n\
          \n    数据优先级：\n    1. Excel真实数据；\n    2. 候选条件识别代码节点；\n    3. 字段识别LLM。\n\n\
          \    主要能力：\n    1. 动态识别Excel表头；\n    2. 精确查询；\n    3. 模糊包含查询；\n    4. 数字和日期比较；\n\
          \    5. 人员详情查询；\n    6. 敏感字段过滤。\n    \"\"\"\n\n    # ==============================\n\
          \    # 0. 统一返回格式\n    # ==============================\n    def response(\n\
          \        message,\n        status,\n        count=0,\n        record=None\n\
          \    ):\n        return {\n            \"message\": str(message),\n    \
          \        \"status\": str(status),\n            \"count\": int(count),\n\
          \            \"record\": \"\"\n        }\n\n    # 公司工作室将大列表以 JSON 字符串传入；本地列表输入也兼容。\n\
          \    try:\n      if isinstance(employees, str):\n        employees = json.loads(employees)\
          \ if employees.strip() else []\n      else:  \n        employees = employees\
          \ or []\n    except Exception:\n      return response(\n        \"人员数据解析失败：employees\
          \ 不是有效的 JSON 数据。\",\n        \"error\"\n    )\n\n    try:\n     if isinstance(headers,\
          \ str):\n        headers = json.loads(headers) if headers.strip() else []\n\
          \     else:\n        headers = headers or []\n    except Exception:\n  \
          \   return response(\n        \"Excel表头解析失败：headers 不是有效的 JSON 数据。\",\n\
          \        \"error\"\n    )\n\n     structured_output = structured_output\
          \ or {}\n     query = str(query or \"\").strip()\n\n    # ==============================\n\
          \    # 2. 检查人员数据\n    # ==============================\n    if not isinstance(employees,\
          \ list):\n        return response(\n            \"人员数据格式错误，employees必须是数组。\"\
          ,\n            \"error\"\n        )\n\n    if not employees:\n        return\
          \ response(\n            \"没有可查询的人员数据。\",\n            \"error\"\n     \
          \   )\n\n    valid_employees = []\n\n    for employee in employees:\n  \
          \      if isinstance(employee, dict):\n            valid_employees.append(employee)\n\
          \n    employees = valid_employees\n\n    if not employees:\n        return\
          \ response(\n            \"人员数据中没有有效记录。\",\n            \"error\"\n    \
          \    )\n\n    # ==============================\n    # 3. 检查并清理Excel表头\n\
          \    # ==============================\n    if not isinstance(headers, list):\n\
          \        return response(\n            \"Excel表头格式错误，headers必须是数组。\",\n\
          \            \"error\"\n        )\n\n    clean_headers = []\n\n    for header\
          \ in headers:\n        clean_header = str(header).strip()\n\n        if\
          \ (\n            clean_header\n            and clean_header not in clean_headers\n\
          \        ):\n            clean_headers.append(clean_header)\n\n    headers\
          \ = clean_headers\n\n    if not headers:\n        return response(\n   \
          \         \"没有识别到Excel表头。\",\n            \"error\"\n        )\n\n    #\
          \ ==============================\n    # 4. 兼容structured_output为JSON字符串\n\
          \    # ==============================\n    if isinstance(structured_output,\
          \ str):\n        structured_text = structured_output.strip()\n\n       \
          \ structured_text = (\n            structured_text\n            .replace(\"\
          ```json\", \"\")\n            .replace(\"```JSON\", \"\")\n            .replace(\"\
          ```\", \"\")\n            .strip()\n        )\n\n        if not structured_text:\n\
          \            structured_output = {}\n        else:\n            try:\n \
          \               structured_output = json.loads(\n                    structured_text\n\
          \                )\n            except Exception:\n                return\
          \ response(\n                    \"字段识别结果不是有效的JSON格式。\",\n             \
          \       \"error\"\n                )\n\n    if not isinstance(structured_output,\
          \ dict):\n        return response(\n            \"字段识别结果格式错误。\",\n     \
          \       \"error\"\n        )\n\n    # ==============================\n \
          \   # 5. 解析candidate_json\n    # ==============================\n    authoritative_candidates\
          \ = []\n\n    if candidate_json:\n        if isinstance(candidate_json,\
          \ str):\n            candidate_text = candidate_json.strip()\n\n       \
          \     if candidate_text:\n                try:\n                    authoritative_candidates\
          \ = json.loads(\n                        candidate_text\n              \
          \      )\n                except Exception:\n                    return\
          \ response(\n                        \"候选条件不是有效的JSON格式。\",\n           \
          \             \"error\"\n                    )\n\n        elif isinstance(candidate_json,\
          \ list):\n            authoritative_candidates = candidate_json\n\n    \
          \    else:\n            return response(\n                \"候选条件格式错误。\"\
          ,\n                \"error\"\n            )\n\n    if not isinstance(\n\
          \        authoritative_candidates,\n        list\n    ):\n        return\
          \ response(\n            \"候选条件必须是数组。\",\n            \"error\"\n      \
          \  )\n\n    # ==============================\n    # 6. 检查候选条件是否存在歧义\n  \
          \  # ==============================\n    ambiguous_candidates = []\n\n \
          \   for candidate in authoritative_candidates:\n        if not isinstance(candidate,\
          \ dict):\n            continue\n\n        if (\n            candidate.get(\"\
          match_type\")\n            == \"ambiguous_value_match\"\n        ):\n  \
          \          ambiguous_candidates.append(candidate)\n\n    if ambiguous_candidates:\n\
          \        descriptions = []\n\n        for candidate in ambiguous_candidates:\n\
          \            value = str(\n                candidate.get(\"value\", \"\"\
          )\n            ).strip()\n\n            possible_fields = candidate.get(\n\
          \                \"possible_fields\",\n                []\n            )\n\
          \n            if not isinstance(possible_fields, list):\n              \
          \  possible_fields = []\n\n            field_text = \"、\".join(\n      \
          \          str(field)\n                for field in possible_fields\n  \
          \          )\n\n            descriptions.append(\n                f\"“{value}”可能属于字段：{field_text}\"\
          \n            )\n\n        return response(\n            \"无法唯一确定查询字段。\"\
          \n            + \"；\".join(descriptions)\n            + \"。请在问题中明确说明字段名称。\"\
          ,\n            \"error\"\n        )\n\n    # ==============================\n\
          \    # 7. 提取可信候选条件\n    # ==============================\n    confirmed_conditions\
          \ = []\n\n    allowed_candidate_types = {\n        \"exact_value_match\"\
          ,\n        \"gender_pattern_match\"\n    }\n\n    for candidate in authoritative_candidates:\n\
          \        if not isinstance(candidate, dict):\n            continue\n\n \
          \       match_type = str(\n            candidate.get(\"match_type\", \"\"\
          )\n        ).strip()\n\n        if match_type not in allowed_candidate_types:\n\
          \            continue\n\n        field = str(\n            candidate.get(\"\
          field\", \"\")\n        ).strip()\n\n        operator = str(\n         \
          \   candidate.get(\n                \"operator\",\n                \"equals\"\
          \n            )\n        ).strip().lower()\n\n        value = str(\n   \
          \         candidate.get(\"value\", \"\")\n        ).strip()\n\n        if\
          \ not field or not value:\n            continue\n\n        confirmed_condition\
          \ = {\n            \"field\": field,\n            \"operator\": operator,\n\
          \            \"value\": value\n        }\n\n        if confirmed_condition\
          \ not in confirmed_conditions:\n            confirmed_conditions.append(\n\
          \                confirmed_condition\n            )\n\n    # ==============================\n\
          \    # 8. 获取LLM查询计划\n    # ==============================\n    intent =\
          \ str(\n        structured_output.get(\"intent\", \"\")\n    ).strip().lower()\n\
          \n    allowed_intents = {\n        \"detail\",\n        \"list\",\n    \
          \    \"count\"\n    }\n\n    if intent == \"unsupported\":\n        if confirmed_conditions:\n\
          \            intent = \"list\"\n        else:\n            return response(\n\
          \                \"问题中涉及的字段不存在、不允许查询，或无法确定查询条件。\",\n                \"error\"\
          \n            )\n\n    if intent not in allowed_intents:\n        return\
          \ response(\n            \"未识别到有效查询意图。\",\n            \"error\"\n     \
          \   )\n\n    llm_conditions = structured_output.get(\n        \"conditions\"\
          ,\n        []\n    )\n\n    # 复合OR：组内AND，组间OR；普通conditions保持全AND语义。\n  \
          \  raw_condition_groups = structured_output.get(\n        \"condition_groups\"\
          ,\n        []\n    )\n\n    if raw_condition_groups is None:\n        raw_condition_groups\
          \ = []\n\n    if not isinstance(raw_condition_groups, list):\n        return\
          \ response(\n            \"复合OR条件格式错误，condition_groups必须是数组。\",\n      \
          \      \"error\"\n        )\n\n    if raw_condition_groups and llm_conditions:\n\
          \        return response(\n            \"使用condition_groups时，conditions必须为空数组。\"\
          ,\n            \"error\"\n        )\n\n    has_or_groups = bool(raw_condition_groups)\n\
          \n    if has_or_groups:\n        llm_conditions = []\n\n        for group_index,\
          \ group in enumerate(\n            raw_condition_groups,\n            start=1\n\
          \        ):\n            if not isinstance(group, dict):\n             \
          \   return response(\n                    f\"第{group_index}个OR条件组格式错误。\"\
          ,\n                    \"error\"\n                )\n\n            group_conditions\
          \ = group.get(\"conditions\", [])\n\n            if (\n                not\
          \ isinstance(group_conditions, list)\n                or not group_conditions\n\
          \            ):\n                return response(\n                    f\"\
          第{group_index}个OR条件组必须包含conditions数组。\",\n                    \"error\"\n\
          \                )\n\n            for group_condition in group_conditions:\n\
          \                if not isinstance(group_condition, dict):\n           \
          \         return response(\n                        f\"第{group_index}个OR条件组存在无效条件。\"\
          ,\n                        \"error\"\n                    )\n\n        \
          \        group_condition = dict(group_condition)\n                group_condition[\"\

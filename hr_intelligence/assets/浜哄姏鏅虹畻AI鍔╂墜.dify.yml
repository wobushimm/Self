          hint: 按 0903 样例上传 A:AI 导入区；新增 AE:AI 五个参数用于控制在岗月数、绩效、社保上涨和工会比例。
          label: 完整人员信息底表
          max_length: 1
          options: []
          placeholder: ''
          required: true
          type: file
          variable: excel_file
      height: 109
      id: '1778747152378'
      position:
        x: -2070.415608093387
